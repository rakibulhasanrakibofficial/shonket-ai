[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/official-search"
  to = "/.netlify/functions/official-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/domain-search"
  to = "/.netlify/functions/live-domain-search"
  status = 200
  force = true
