name = "shonket-ai"
main = "./src/worker.js"
compatibility_date = "2026-11-03"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[ai]
binding = "AI"

[[ratelimits]]
name = "ANALYZE_RATE_LIMITER"
namespace_id = "2026110301"

[ratelimits.simple]
limit = 12
period = 60

[[ratelimits]]
name = "OFFICIAL_SEARCH_RATE_LIMITER"
namespace_id = "2026110302"

[ratelimits.simple]
limit = 12
period = 60

[vars]
CLOUDFLARE_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
OFFICIAL_SOURCE_SEARCH_ENABLED = "true"
CORS_ALLOWED_ORIGINS = "https://rakibulhasanrakibofficial.github.io,http://localhost:5173,http://127.0.0.1:5173"
