name: Deploy Cloudflare Worker API

on:
  push:
    branches: [main]
    paths:
      - "src/worker.js"
      - "netlify/functions/**"
      - "api/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "scripts/live-worker-smoke.mjs"
      - "tests/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run fast tests
        run: npm run test:fast

      - name: Build Worker static assets
        run: npm run build

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: e2277133789312b1f0a906e9ee32f038
          command: deploy

      - name: Verify live Worker and AI inference
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/live-worker-smoke.mjs
        env:
          SHONKET_WORKER_URL: https://shonket-ai.rakibhasan212029.workers.dev

      - name: Deployment credential required
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::Cloudflare deployment skipped. Add the CLOUDFLARE_API_TOKEN GitHub Actions secret with the Edit Cloudflare Workers permission, then run this workflow again."
